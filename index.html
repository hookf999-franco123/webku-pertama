
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f0f4f8;
      color: #243047;
    }
    .kartu {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <h1>Halo, dunia!</h1>
    <p>Ini adalah website pertama saya.</p>
    <button onclick="alert('Website saya berhasil!')">
      Klik Saya
    </button>
  </div>
</body>
</html>
